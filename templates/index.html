<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .list-group-item { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            color: #f1f5f9;
            transition: all 0.2s ease;
            border-radius: 10px !important;
        }
        .list-group-item:hover { 
            background-color: #2d3748; 
            border-color: #38bdf8;
        }
        .pipeline-step { font-size: 0.85rem; color: #64748b; }
        .active-step { font-weight: bold; color: #38bdf8; text-decoration: none; border-bottom: 2px solid #38bdf8; padding-bottom: 1px; }
        .designation-link { color: #38bdf8; }
        .designation-link:hover { color: #7dd3fc; }
        .modal-content { background-color: #1e293b; border: 1px solid #334155; color: #f1f5f9; }
        
        /* Star animations */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 5px #fbbf24, 0 0 10px #f59e0b; }
            50% { text-shadow: 0 0 15px #fbbf24, 0 0 20px #f59e0b; }
        }
        
        .resume-star {
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 0.5rem;
            display: inline-block;
        }
        
        .resume-star.generating {
            animation: rotate 2s linear infinite;
            color: #38bdf8;
        }
        
        .resume-star.generated {
            animation: glow 1.5s ease-in-out infinite;
            color: #fbbf24;
        }

        /* Copy Button Icon Placement Styling */
        .copy-path-btn {
            cursor: pointer;
            color: #94a3b8;
            font-size: 1rem;
            margin-left: 0.5rem;
            transition: color 0.2s ease;
        }
        .copy-path-btn:hover {
            color: #38bdf8;
        }

        /* Toast Popup Custom Styling */
        .toast-container { z-index: 1055; }
        .custom-toast { background-color: #1e293b; color: #f8fafc; border: 1px solid #334155; }

        /* diff2html customization for dark theme */
        .d2h-wrapper {
            background-color: #0f172a !important;
        }

        .d2h-file-header {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
        }

        .d2h-file-name {
            color: #38bdf8 !important;
        }

        .d2h-lines {
            background-color: #0f172a !important;
        }

        .d2h-code-line {
            color: #e2e8f0 !important;
        }

        /* Insertions - Green highlights */
        .d2h-ins {
            background-color: rgba(34, 197, 94, 0.25) !important;
        }

        .d2h-ins .d2h-code {
            background-color: rgba(34, 197, 94, 0.4) !important;
            color: #1a1a1a !important;
            font-weight: 600 !important;
        }

        .d2h-ins .d2h-code-line,
        .d2h-ins .d2h-code-line-prefix {
            color: #1a1a1a !important;
        }

        /* Deletions - Red highlights */
        .d2h-del {
            background-color: rgba(239, 68, 68, 0.25) !important;
        }

        .d2h-del .d2h-code {
            background-color: rgba(239, 68, 68, 0.4) !important;
            color: #1a1a1a !important;
            font-weight: 600 !important;
        }

        .d2h-del .d2h-code-line,
        .d2h-del .d2h-code-line-prefix {
            color: #1a1a1a !important;
        }

        /* Context lines */
        .d2h-context {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
        }

        .d2h-context .d2h-code {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
        }

        .d2h-info {
            background-color: #334155 !important;
            color: #94a3b8 !important;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>My Job Applications</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addJobModal">Add Job to Track</button>
    </div>

    <div id="job-list" class="list-group">
    </div>
</div>

<div class="modal fade" id="addJobModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Track New Job</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="jobForm">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" id="company_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Designation</label>
                        <input type="text" id="designation" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea id="job_description" class="form-control"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job URL</label>
                        <input type="url" id="job_url" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Job</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="viewJobModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Job Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Company:</strong> <span id="view-company"></span></p>
                <p><strong>Designation:</strong> <span id="view-designation"></span></p>
                <hr>
                <div id="view-url-container">
                    <strong>URL:</strong> <a id="view-url" href="#" target="_blank">Visit Posting</a>
                </div>
                <p class="mt-3"><strong>Description:</strong></p>
                <p id="view-description" class="text-muted small"></p>
                <p><strong>Status:</strong> <span id="view-status"></span></p>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="viewResumeModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Resume - Base vs Tailored</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 100%;">
                    <div>
                        <h6 style="color: #fca5a5; margin-bottom: 12px;">Base Resume</h6>
                        <div id="base-resume-display" style="background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; max-height: 80vh; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.85rem; color: #cbd5e1;"></div>
                    </div>
                    <div>
                        <h6 style="color: #86efac; margin-bottom: 12px;">Tailored Resume</h6>
                        <div id="tailored-resume-display" style="background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; max-height: 80vh; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.85rem; color: #cbd5e1;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="popupToast" class="toast custom-toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex align-items-center p-2">
            <div id="toast-icon" class="me-2 fs-5"></div>
            <div class="toast-body fw-medium" id="toast-message">
                Placeholder text.
            </div>
            <button type="button" class="btn-close btn-close-white ms-auto me-1" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script>
    const stages = ["viewed", "waiting for referral", "applied", "got interview call", "being interviewed"];
    let jobResumeCheckIntervals = {};

    async function loadJobs() {
        const response = await fetch('/jobs');
        const jobs = await response.json();
        const container = document.getElementById('job-list');
        container.innerHTML = '';

        jobs.forEach(job => {
            const pipelineHtml = stages.map(s => 
                `<span class="${job.status === s ? 'active-step' : 'pipeline-step'}">${s}</span>`
            ).join(' > ');

            const jobData = encodeURIComponent(JSON.stringify(job));
            
            let starHtml = '';
            if (job.resume_generated) {
                starHtml = `<span class="resume-star generated" onclick="redirectToComparison(${job.id})" title="View tailored resume">⭐</span>`;
            } else {
                starHtml = `<span class="resume-star generating" id="star-${job.id}" title="Generating resume...">⭐</span>`;
                startResomeCheckInterval(job.id);
            }

            // Placed the copy clipboard icon directly near the star emoji asset inside the item wrapper
            container.innerHTML += `
                <div class="list-group-item p-3 mb-3">
                    <div class="d-flex justify-content-between">
                        <strong>${job.company_name}</strong>
                        <div class="d-flex align-items-center">
                            <a href="javascript:void(0)" onclick="showDetails('${jobData}')" class="text-decoration-none fw-bold designation-link">
                                ${job.designation}
                            </a>
                            ${job.job_url ? `<a href="${job.job_url}" target="_blank" class="ms-2 text-decoration-none" title="Go to Job URL">🔗</a>` : ''}
                            ${starHtml}
                            <i class="bi bi-clipboard copy-path-btn" onclick="copyResumePath(${job.id})" title="Copy PDF Resume Path"></i>
                        </div>
                    </div>
                    <div class="mt-2 text-muted small">
                        ${pipelineHtml}
                    </div>
                </div>`;
        });
    }

    function startResomeCheckInterval(jobId) {
        if (jobResumeCheckIntervals[jobId]) {
            clearInterval(jobResumeCheckIntervals[jobId]);
        }

        jobResumeCheckIntervals[jobId] = setInterval(async () => {
            const response = await fetch(`/resume-status/${jobId}`);
            const data = await response.json();
            
            if (data.generated) {
                clearInterval(jobResumeCheckIntervals[jobId]);
                delete jobResumeCheckIntervals[jobId];
                
                const starElement = document.getElementById(`star-${jobId}`);
                if (starElement) {
                    starElement.className = 'resume-star generated';
                    starElement.setAttribute('onclick', `redirectToComparison(${jobId})`);
                    starElement.setAttribute('title', 'View tailored resume');
                }
            }
        }, 2000);
    }

    // New verification helper functionality to check path and copy it with floating popups
    async function copyResumePath(jobId) {
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');
        const toastNode = document.getElementById('popupToast');
        const toast = new bootstrap.Toast(toastNode, { delay: 3500 });

        try {
            const response = await fetch(`/fetch_resume_path/${jobId}`);
            const data = await response.json();

            if (response.ok && data.status === "success") {
                await navigator.clipboard.writeText(data.resume_path);
                iconEl.className = "bi bi-clipboard-check-fill text-success";
                msgEl.innerText = "Path successfully copied to clipboard!";
                toast.show();
            } else {
                iconEl.className = "bi bi-exclamation-triangle-fill text-warning";
                msgEl.innerText = data.message || "Resume path has not been formed yet.";
                toast.show();
            }
        } catch (err) {
            iconEl.className = "bi bi-x-circle-fill text-danger";
            msgEl.innerText = "Failed to query the resume path.";
            toast.show();
        }
    }

    window.redirectToComparison = (jobId) => {
        window.location.href = `comparison.html?jobId=${jobId}`;
    };

    window.showDetails = (encodedData) => {
        const job = JSON.parse(decodeURIComponent(encodedData));
        document.getElementById('view-company').innerText = job.company_name;
        document.getElementById('view-designation').innerText = job.designation;
        document.getElementById('view-description').innerText = job.job_description || "No description provided.";
        document.getElementById('view-status').innerText = job.status;
        
        const urlLink = document.getElementById('view-url');
        const urlContainer = document.getElementById('view-url-container');
        if (job.job_url) {
            urlLink.href = job.job_url;
            urlContainer.style.display = 'block';
        } else {
            urlContainer.style.display = 'none';
        }

        const modal = new bootstrap.Modal(document.getElementById('viewJobModal'));
        modal.show();
    };

    document.getElementById('jobForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            company_name: document.getElementById('company_name').value,
            designation: document.getElementById('designation').value,
            job_description: document.getElementById('job_description').value,
            job_url: document.getElementById('job_url').value
        };

        await fetch('/add_job', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        document.getElementById('jobForm').reset();
        const modal = bootstrap.Modal.getInstance(document.getElementById('addJobModal'));
        modal.hide();
        
        loadJobs();
    };

    window.onload = loadJobs;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
