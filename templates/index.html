<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'%3E%3Cpath d='M12 2L14.85 9.15L22 12L14.85 14.85L12 22L9.15 14.85L2 12L9.15 9.15L12 2Z'/%3E%3C/svg%3E">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
        }

        /* Tile layout container */
        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            list-style: none;
            padding: 0;
        }

        .list-group-item { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            color: #f1f5f9;
            transition: all 0.3s ease;
            border-radius: 12px !important;
            display: flex;
            flex-direction: column;
            padding: 1.5rem !important;
            margin-bottom: 0 !important;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* Dynamic Status Gradient Colors */
        .list-group-item.status-viewed {
            background-color: #162238; /* Muted Dark Navy Blue */
            border-color: #1e3a8a;
        }
        .list-group-item.status-viewed:hover {
            background-color: #1d2d4a;
        }

        .list-group-item.status-waiting {
            background-color: #1e295d; /* Medium Steel Blue/Indigo mix */
            border-color: #2563eb;
        }
        .list-group-item.status-waiting:hover {
            background-color: #273575;
        }

        .list-group-item.status-applied {
            background-color: #2e2252; /* Deep Violet/Lavender-Tinted Night Blue */
            border-color: #6d28d9;
        }
        .list-group-item.status-applied:hover {
            background-color: #3b2c68;
        }

        .list-group-item.status-interview {
            background-color: #143134; /* Dark Teal Accent for Interviews */
            border-color: #0d9488;
        }
        .list-group-item.status-interview:hover {
            background-color: #1b4145;
        }

        .list-group-item.status-rejected {
            background-color: #1e1b1b; /* Neutral dark for rejections */
            border-color: #451a1a;
            opacity: 0.75;
        }
        .list-group-item.status-rejected:hover {
            background-color: #262222;
            opacity: 1;
        }

        .list-group-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #8b5cf6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .list-group-item:hover { 
            border-color: #38bdf8;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
        }

        .list-group-item:hover::before {
            opacity: 1;
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .job-company-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f1f5f9;
            margin: 0;
        }

        .job-days-ago {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: normal;
            margin-left: 0.5rem;
        }

        .job-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pipeline-step { font-size: 0.85rem; color: #64748b; }
        .active-step { font-weight: bold; color: #38bdf8; text-decoration: none; border-bottom: 2px solid #38bdf8; padding-bottom: 1px; }
        
        .designation-link { 
            color: #38bdf8; 
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-word;
        }
        .designation-link:hover { 
            color: #7dd3fc; 
            text-decoration: underline;
        }
        
        .modal-content { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            color: #f1f5f9; 
        }
        
        /* Star animations */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes glow-blue {
            0%, 100% { text-shadow: 0 0 5px #38bdf8, 0 0 10px #3b82f6; }
            50% { text-shadow: 0 0 15px #7dd3fc, 0 0 20px #60a5fa; }
        }

        @keyframes glow-red {
            0%, 100% { text-shadow: 0 0 5px #ef4444, 0 0 10px #dc2626; filter: drop-shadow(0 0 2px #ef4444); }
            50% { text-shadow: 0 0 12px #f87171, 0 0 18px #ef4444; filter: drop-shadow(0 0 5px #f87171); }
        }
        
        .resume-star {
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 0.5rem;
            display: inline-block;
        }
        
        .resume-star.generating {
            animation: rotate 2s linear infinite;
            color: #38bdf8;
        }
        
        .resume-star.generated {
            animation: glow-blue 1.5s ease-in-out infinite;
            color: #38bdf8; 
        }

        .resume-star.failed {
            animation: glow-red 1.5s ease-in-out infinite;
            color: #ef4444 !important;
        }

        /* Copy Button Icon Placement Styling */
        .copy-path-btn {
            cursor: pointer;
            color: #94a3b8;
            font-size: 1rem;
            margin-left: 0.5rem;
            transition: color 0.2s ease;
        }
        .copy-path-btn:hover {
            color: #38bdf8;
        }

        /* Toast Popup Custom Styling */
        .toast-container { z-index: 1055; }
        .custom-toast { background-color: #1e293b; color: #f8fafc; border: 1px solid #334155; }

        /* diff2html customization for dark theme */
        .d2h-wrapper {
            background-color: #0f172a !important;
        }

        .d2h-file-header {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
        }

        .d2h-file-name {
            color: #38bdf8 !important;
        }

        .d2h-lines {
            background-color: #0f172a !important;
        }

        .d2h-code-line {
            color: #e2e8f0 !important;
        }

        /* Insertions - Green highlights */
        .d2h-ins {
            background-color: rgba(34, 197, 94, 0.25) !important;
        }

        .d2h-ins .d2h-code {
            background-color: rgba(34, 197, 94, 0.4) !important;
            color: #1a1a1a !important;
            font-weight: 600 !important;
        }

        .d2h-ins .d2h-code-line,
        .d2h-ins .d2h-code-line-prefix {
            color: #1a1a1a !important;
        }

        /* Deletions - Red highlights */
        .d2h-del {
            background-color: rgba(239, 68, 68, 0.25) !important;
        }

        .d2h-del .d2h-code {
            background-color: rgba(239, 68, 68, 0.4) !important;
            color: #1a1a1a !important;
            font-weight: 600 !important;
        }

        .d2h-del .d2h-code-line,
        .d2h-del .d2h-code-line-prefix {
            color: #1a1a1a !important;
        }

        /* Context lines */
        .d2h-context {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
        }

        .d2h-context .d2h-code {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
        }

        .d2h-info {
            background-color: #334155 !important;
            color: #94a3b8 !important;
        }

        /* Status dropdown styling */
        .status-dropdown {
            appearance: none;
            background-color: transparent;
            border: none;
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.25rem 1.5rem 0.25rem 0.25rem;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0 center;
            background-size: 1.2em;
            padding-right: 1.8rem;
            transition: color 0.2s ease;
        }

        .status-dropdown:hover {
            color: #7dd3fc;
        }

        .status-dropdown:focus {
            outline: none;
            border-bottom: 2px solid #38bdf8;
        }

        .status-dropdown option {
            background-color: #1e293b;
            color: #f1f5f9;
        }

        /* Referrals input styling */
        .referrals-input {
            background-color: transparent;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            font-size: 0.9rem;
            width: 60px;
            transition: all 0.2s ease;
        }

        .referrals-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .referrals-input:hover {
            border-color: #38bdf8;
        }

        .custom-select-wrapper {
            min-width: 180px;
            text-align: right;
        }

        .referrals-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-right: 0.5rem;
        }

        /* Referral copy button styling */
        .referral-copy-btn {
            cursor: pointer;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-left: 0.5rem;
            transition: all 0.2s ease;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .referral-copy-btn:hover {
            color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.1);
        }

        /* Section styling styling */
        .section-header-btn {
            background: none;
            border: none;
            color: #f8fafc;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .section-header-btn:focus {
            outline: none;
        }

        .section-header-btn .bi-chevron-down {
            transition: transform 0.2s ease;
            font-size: 1.2rem;
            color: #64748b;
        }

        .section-header-btn.collapsed .bi-chevron-down {
            transform: rotate(-90deg);
        }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width: 1400px; margin: 0 auto; padding: 2rem;">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 style="margin: 0;">My Job Applications</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addJobModal">Add Job to Track</button>
    </div>

    <!-- Active Section -->
    <div class="mb-5">
        <h2 class="mb-4" id="active-title">Active jobs (0)</h2>
        <div id="active-job-list" class="job-grid"></div>
    </div>

    <hr class="my-5" style="border-color: #334155;">

    <!-- Applied Section -->
    <div class="mb-5">
        <h2 class="mb-4" id="applied-title">Applied jobs (0)</h2>
        <div id="applied-job-list" class="job-grid"></div>
    </div>

    <hr class="my-5" style="border-color: #334155;">

    <!-- Rejected Section -->
    <div class="mb-5">
        <button class="section-header-btn collapsed mb-4" type="button" data-bs-toggle="collapse" data-bs-target="#rejectedCollapse" aria-expanded="false" aria-controls="rejectedCollapse">
            <i class="bi bi-chevron-down"></i>
            <span id="rejected-title">Rejected jobs (0)</span>
        </button>
        <div class="collapse" id="rejectedCollapse">
            <div id="rejected-job-list" class="job-grid"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="addJobModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Track New Job</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="jobForm">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" id="company_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Designation</label>
                        <input type="text" id="designation" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea id="job_description" class="form-control"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job URL</label>
                        <input type="url" id="job_url" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Job</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="viewJobModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Job Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Company:</strong> <span id="view-company"></span></p>
                <p><strong>Designation:</strong> <span id="view-designation"></span></p>
                <hr>
                <div id="view-url-container">
                    <strong>URL:</strong> <a id="view-url" href="#" target="_blank">Visit Posting</a>
                </div>
                <p class="mt-3"><strong>Description:</strong></p>
                <p id="view-description" class="text-muted small"></p>
                <p><strong>Status:</strong> <span id="view-status"></span></p>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="viewResumeModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Resume - Base vs Tailored</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 100%;">
                    <div>
                        <h6 style="color: #fca5a5; margin-bottom: 12px;">Base Resume</h6>
                        <div id="base-resume-display" style="background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; max-height: 80vh; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.85rem; color: #cbd5e1;"></div>
                    </div>
                    <div>
                        <h6 style="color: #86efac; margin-bottom: 12px;">Tailored Resume</h6>
                        <div id="tailored-resume-display" style="background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; max-height: 80vh; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.85rem; color: #cbd5e1;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="popupToast" class="toast custom-toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex align-items-center p-2">
            <div id="toast-icon" class="me-2 fs-5"></div>
            <div class="toast-body fw-medium" id="toast-message">
                Placeholder text.
            </div>
            <button type="button" class="btn-close btn-close-white ms-auto me-1" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script>
    const stages = [
        "viewed", 
        "waiting for referral", 
        "applied with referral", 
        "applied without referral", 
        "got interview call", 
        "being interviewed",
        "rejected without applying",
        "rejected after applying"
    ];
    let jobResumeCheckIntervals = {};

    /* Maps stage string names to explicit visual CSS background classes */
    function getStatusClass(status) {
        switch (status) {
            case 'viewed':
                return 'status-viewed';
            case 'waiting for referral':
                return 'status-waiting';
            case 'applied with referral':
            case 'applied without referral':
                return 'status-applied';
            case 'got interview call':
            case 'being interviewed':
                return 'status-interview';
            case 'rejected without applying':
            case 'rejected after applying':
                return 'status-rejected';
            default:
                return '';
        }
    }

    /* Computes relative text string (X days ago) based on backend date_added */
    function getDaysAgoText(dateString) {
        if (!dateString) return '';
        
        const addedDate = new Date(dateString);
        const today = new Date();
        
        // Zero out the hours to get clean calendar day differences
        addedDate.setHours(0,0,0,0);
        today.setHours(0,0,0,0);
        
        const diffTime = today - addedDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays < 0) return '';
        if (diffDays === 0) return '<span class="job-days-ago">(Today)</span>';
        if (diffDays === 1) return '<span class="job-days-ago">(1 day ago)</span>';
        return `<span class="job-days-ago">(${diffDays} days ago)</span>`;
    }

    async function loadJobs() {
        const response = await fetch('/jobs');
        const jobs = await response.json();
        
        const activeContainer = document.getElementById('active-job-list');
        const appliedContainer = document.getElementById('applied-job-list');
        const rejectedContainer = document.getElementById('rejected-job-list');
        
        activeContainer.innerHTML = '';
        appliedContainer.innerHTML = '';
        rejectedContainer.innerHTML = '';

        let activeCount = 0;
        let appliedCount = 0;
        let rejectedCount = 0;

        jobs.forEach(job => {
            const statusOptions = stages.map(s => 
                `<option value="${s}" ${job.status === s ? 'selected' : ''}>${s}</option>`
            ).join('');

            const jobData = encodeURIComponent(JSON.stringify(job));
            const colorModifierClass = getStatusClass(job.status);
            const daysAgoHtml = getDaysAgoText(job.date_added);
            
            let starHtml = '';
            if (job.resume_generated === 1) {
                starHtml = `<span class="resume-star generated" onclick="event.stopPropagation(); redirectToComparison(${job.id})" title="View tailored resume">⭐</span>`;
            } else if (job.resume_generated === -1) {
                starHtml = `<span class="resume-star failed" id="star-${job.id}" onclick="event.stopPropagation(); retriggerResumeGeneration(${job.id})" title="Generation failed. Click to re-trigger.">⭐</span>`;
            } else {
                starHtml = `<span class="resume-star generating" id="star-${job.id}" onclick="event.stopPropagation();" title="Generating resume...">⭐</span>`;
                startResumeCheckInterval(job.id);
            }

            const cardHtml = `
                <div class="list-group-item ${colorModifierClass}" onclick="showDetails('${jobData}')">
                    <div class="job-card-header">
                        <div style="flex-grow: 1;">
                            <h3 class="job-company-name">${job.company_name}${daysAgoHtml}</h3>
                            <a href="javascript:void(0)" onclick="event.stopPropagation(); showDetails('${jobData}')" class="text-decoration-none fw-normal designation-link">
                                ${job.designation}
                            </a>
                        </div>
                        <div class="job-actions">
                            ${job.job_url ? `<a href="${job.job_url}" target="_blank" class="text-decoration-none" title="Go to Job URL" onclick="event.stopPropagation();">🔗</a>` : ''}
                            ${starHtml}
                            <i class="bi bi-clipboard copy-path-btn" onclick="event.stopPropagation(); copyResumePath(${job.id})" title="Copy PDF Resume Path"></i>
                        </div>
                    </div>

                    <div style="flex-grow: 1;">
                        <div class="mt-3 d-flex align-items-center justify-content-between">
                            <label style="font-size: 0.8rem; color: #94a3b8; margin: 0;">Status:</label>
                            <div class="custom-select-wrapper">
                                <select class="status-dropdown" onclick="event.stopPropagation()" onchange="updateJobStatus(${job.id}, this.value)">
                                    ${statusOptions}
                                </select>
                            </div>
                        </div>

                        <div class="mt-3 d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <label class="referrals-label" style="margin: 0;">Referrals:</label>
                                <input type="number" class="referrals-input" id="referrals-${job.id}" value="${job.referrals || 0}" min="0" onclick="event.stopPropagation()" onchange="updateReferrals(${job.id}, this.value)" onkeypress="handleReferralsKeypress(event, ${job.id})" />
                                <i class="bi bi-chat-quote referral-copy-btn" onclick="event.stopPropagation(); copyReferralMessage(${job.id}, '${job.company_name}', '${job.designation}', '${job.job_url || ''}')" title="Copy referral request message"></i>
                            </div>
                        </div>
                    </div>
                </div>`;

            if (job.status === "rejected without applying" || job.status === "rejected after applying") {
                rejectedContainer.innerHTML += cardHtml;
                rejectedCount++;
            } else if (job.status === "applied with referral" || job.status === "applied without referral") {
                appliedContainer.innerHTML += cardHtml;
                appliedCount++;
            } else {
                activeContainer.innerHTML += cardHtml;
                activeCount++;
            }
        });

        document.getElementById('active-title').innerText = `Active jobs (${activeCount})`;
        document.getElementById('applied-title').innerText = `Applied jobs (${appliedCount})`;
        document.getElementById('rejected-title').innerText = `Rejected jobs (${rejectedCount})`;
    }

    function startResumeCheckInterval(jobId) {
        if (jobResumeCheckIntervals[jobId]) {
            clearInterval(jobResumeCheckIntervals[jobId]);
        }

        jobResumeCheckIntervals[jobId] = setInterval(async () => {
            const response = await fetch(`/resume-status/${jobId}`);
            const data = await response.json();
            
            const starElement = document.getElementById(`star-${jobId}`);
            if (!starElement) {
                clearInterval(jobResumeCheckIntervals[jobId]);
                delete jobResumeCheckIntervals[jobId];
                return;
            }

            if (data.generated === 1) {
                clearInterval(jobResumeCheckIntervals[jobId]);
                delete jobResumeCheckIntervals[jobId];
                
                starElement.className = 'resume-star generated';
                starElement.setAttribute('onclick', `event.stopPropagation(); redirectToComparison(${jobId})`);
                starElement.setAttribute('title', 'View tailored resume');
            } else if (data.generated === -1) {
                clearInterval(jobResumeCheckIntervals[jobId]);
                delete jobResumeCheckIntervals[jobId];
                
                starElement.className = 'resume-star failed';
                starElement.setAttribute('onclick', `event.stopPropagation(); retriggerResumeGeneration(${jobId})`);
                starElement.setAttribute('title', `Generation failed: ${data.error_message || 'API Error'}. Click to retry.`);
                
                showToast("bi bi-exclamation-octagon-fill text-danger", `Resume generation failed for job #${jobId}`);
            }
        }, 2000);
    }

    async function retriggerResumeGeneration(jobId) {
        const starElement = document.getElementById(`star-${jobId}`);
        if (starElement) {
            // Instantly transition to rotation style while thread handles API allocation
            starElement.className = 'resume-star generating';
            starElement.removeAttribute('onclick');
            starElement.setAttribute('title', 'Retrying resume generation...');
        }

        try {
            const response = await fetch(`/regenerate-resume/${jobId}`, { method: 'POST' });
            const data = await response.json();

            if (response.ok) {
                showToast("bi bi-arrow-clockwise text-info", "Re-triggered Gemini tailoring worker thread!");
                startResumeCheckInterval(jobId);
            } else {
                throw new Error(data.message || "Failed execution query workflow.");
            }
        } catch (err) {
            showToast("bi bi-x-circle-fill text-danger", `Error: ${err.message}`);
            if (starElement) {
                starElement.className = 'resume-star failed';
                starElement.setAttribute('onclick', `event.stopPropagation(); retriggerResumeGeneration(${jobId})`);
            }
        }
    }

    function showToast(iconClass, message) {
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');
        const toastNode = document.getElementById('popupToast');
        const toast = new bootstrap.Toast(toastNode, { delay: 4000 });

        iconEl.className = iconClass;
        msgEl.innerText = message;
        toast.show();
    }

    async function updateJobStatus(jobId, newStatus) {
        try {
            const response = await fetch(`/update-job-status/${jobId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });

            const data = await response.json();

            if (response.ok) {
                showToast("bi bi-check-circle-fill text-success", `Status updated to "${newStatus}"`);
                loadJobs();
            } else {
                throw new Error(data.message || 'Failed to update status');
            }
        } catch (err) {
            showToast("bi bi-exclamation-triangle-fill text-warning", "Failed to update job status");
            loadJobs();
        }
    }

    async function updateReferrals(jobId, referralsCount) {
        const count = parseInt(referralsCount) || 0;

        try {
            const response = await fetch(`/update-referrals/${jobId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ referrals: count })
            });

            const data = await response.json();

            if (response.ok) {
                showToast("bi bi-check-circle-fill text-success", `Referrals updated to ${count}`);
            } else {
                throw new Error(data.message || 'Failed to update referrals');
            }
        } catch (err) {
            showToast("bi bi-exclamation-triangle-fill text-warning", "Failed to update referrals");
            loadJobs();
        }
    }

    function handleReferralsKeypress(event, jobId) {
        if (event.key === 'Enter') {
            event.target.blur();
            updateReferrals(jobId, event.target.value);
        }
    }

    function copyReferralMessage(jobId, companyName, designation, jobUrl) {
        const message = `I'm Senthil, an Associate Data Engineer at JP Morgan Chase...\n\nI believe my skills are a strong match for the ${designation} position at ${companyName}. Can you please provide me a referral for this role?\n\nJoblink: ${jobUrl}`;
        
        navigator.clipboard.writeText(message).then(() => {
            showToast("bi bi-check-circle-fill text-success", "Referral message copied to clipboard!");
        }).catch(err => {
            showToast("bi bi-exclamation-triangle-fill text-warning", "Failed to copy referral message");
        });
    }

    async function copyResumePath(jobId) {
        try {
            const response = await fetch(`/fetch_resume_path/${jobId}`);
            const data = await response.json();

            if (response.ok && data.status === "success") {
                await navigator.clipboard.writeText(data.resume_path);
                showToast("bi bi-clipboard-check-fill text-success", "Path successfully copied to clipboard!");
            } else {
                showToast("bi bi-exclamation-triangle-fill text-warning", data.message || "Resume path has not been formed yet.");
            }
        } catch (err) {
            showToast("bi bi-x-circle-fill text-danger", "Failed to query the resume path.");
        }
    }

    window.redirectToComparison = (jobId) => {
        window.location.href = `comparison.html?jobId=${jobId}`;
    };

    window.showDetails = (encodedData) => {
        const job = JSON.parse(decodeURIComponent(encodedData));
        document.getElementById('view-company').innerText = job.company_name;
        document.getElementById('view-designation').innerText = job.designation;
        document.getElementById('view-description').innerText = job.job_description || "No description provided.";
        document.getElementById('view-status').innerText = job.status;
        
        const urlLink = document.getElementById('view-url');
        const urlContainer = document.getElementById('view-url-container');
        if (job.job_url) {
            urlLink.href = job.job_url;
            urlContainer.style.display = 'block';
        } else {
            urlContainer.style.display = 'none';
        }

        const modal = new bootstrap.Modal(document.getElementById('viewJobModal'));
        modal.show();
    };

    document.getElementById('jobForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            company_name: document.getElementById('company_name').value,
            designation: document.getElementById('designation').value,
            job_description: document.getElementById('job_description').value,
            job_url: document.getElementById('job_url').value
        };

        await fetch('/add_job', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        document.getElementById('jobForm').reset();
        const modal = bootstrap.Modal.getInstance(document.getElementById('addJobModal'));
        modal.hide();
        
        loadJobs();
    };

    window.onload = loadJobs;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
