<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .list-group-item { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            color: #f1f5f9;
            transition: all 0.2s ease;
            border-radius: 10px !important;
        }
        .list-group-item:hover { 
            background-color: #2d3748; 
            border-color: #38bdf8;
        }
        .pipeline-step { font-size: 0.85rem; color: #64748b; }
        .active-step { font-weight: bold; color: #38bdf8; text-decoration: none; border-bottom: 2px solid #38bdf8; padding-bottom: 1px; }
        .designation-link { color: #38bdf8; }
        .designation-link:hover { color: #7dd3fc; }
        .modal-content { background-color: #1e293b; border: 1px solid #334155; color: #f1f5f9; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>My Job Applications</h1>
        <!-- Button to trigger Modal -->
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addJobModal">Add Job to Track</button>
    </div>

    <!-- Pipeline View -->
    <div id="job-list" class="list-group">
        <!-- Jobs will be injected here by JavaScript -->
    </div>
</div>

<!-- Add Job Modal -->
<div class="modal fade" id="addJobModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Track New Job</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="jobForm">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" id="company_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Designation</label>
                        <input type="text" id="designation" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea id="job_description" class="form-control"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job URL</label>
                        <input type="url" id="job_url" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Job</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- View Job Details Modal -->
<div class="modal fade" id="viewJobModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Job Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Company:</strong> <span id="view-company"></span></p>
                <p><strong>Designation:</strong> <span id="view-designation"></span></p>
                <hr>
                <div id="view-url-container">
                    <strong>URL:</strong> <a id="view-url" href="#" target="_blank">Visit Posting</a>
                </div>
                <p class="mt-3"><strong>Description:</strong></p>
                <p id="view-description" class="text-muted small"></p>
                <p><strong>Status:</strong> <span id="view-status"></span></p>
            </div>
        </div>
    </div>
</div>

<script>
    const stages = ["viewed", "waiting for referral", "applied", "got interview call", "being interviewed"];

    // Function to fetch and display jobs
    async function loadJobs() {
        const response = await fetch('/jobs');
        const jobs = await response.json();
        const container = document.getElementById('job-list');
        container.innerHTML = '';

        jobs.forEach(job => {
            const pipelineHtml = stages.map(s => 
                `<span class="${job.status === s ? 'active-step' : 'pipeline-step'}">${s}</span>`
            ).join(' > ');

            const jobData = encodeURIComponent(JSON.stringify(job));

            container.innerHTML += `
                <div class="list-group-item p-3 mb-3">
                    <div class="d-flex justify-content-between">
                        <strong>${job.company_name}</strong>
                        <div>
                            <a href="javascript:void(0)" onclick="showDetails('${jobData}')" class="text-decoration-none fw-bold designation-link">
                                ${job.designation}
                            </a>
                            ${job.job_url ? `<a href="${job.job_url}" target="_blank" class="ms-2 text-decoration-none" title="Go to Job URL">🔗</a>` : ''}
                        </div>
                    </div>
                    <div class="mt-2 text-muted small">
                        ${pipelineHtml}
                    </div>
                </div>`;
        });
    }

    // Function to populate and show the details modal
    window.showDetails = (encodedData) => {
        const job = JSON.parse(decodeURIComponent(encodedData));
        document.getElementById('view-company').innerText = job.company_name;
        document.getElementById('view-designation').innerText = job.designation;
        document.getElementById('view-description').innerText = job.job_description || "No description provided.";
        document.getElementById('view-status').innerText = job.status;
        
        const urlLink = document.getElementById('view-url');
        const urlContainer = document.getElementById('view-url-container');
        if (job.job_url) {
            urlLink.href = job.job_url;
            urlContainer.style.display = 'block';
        } else {
            urlContainer.style.display = 'none';
        }

        const modal = new bootstrap.Modal(document.getElementById('viewJobModal'));
        modal.show();
    };

    // Handle Form Submission
    document.getElementById('jobForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            company_name: document.getElementById('company_name').value,
            designation: document.getElementById('designation').value,
            job_description: document.getElementById('job_description').value,
            job_url: document.getElementById('job_url').value
        };

        await fetch('/add_job', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        location.reload(); // Refresh to show new job
    };

    window.onload = loadJobs;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
